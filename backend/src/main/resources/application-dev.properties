# Dev profile: in-memory H2, no PostgreSQL needed.
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:file:./data/careerpilot;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Dev-only secret. Never use this in production.
app.jwt.secret=dev-only-secret-change-me-0123456789-abcdefghij
