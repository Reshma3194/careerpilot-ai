spring.application.name=careerpilot-ai
server.port=8080

# --- Database (PostgreSQL by default; override with env vars) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/careerpilot}
spring.datasource.username=${DB_USERNAME:careerpilot}
spring.datasource.password=${DB_PASSWORD:careerpilot}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- File uploads (resumes) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- JWT (JWT_SECRET must be set and at least 32 characters) ---
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS (comma separated list of allowed origins) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Gemini ---
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.gemini.timeout-seconds=60

management.endpoints.web.exposure.include=health
